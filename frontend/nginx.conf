server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # CV uploads are capped at 10 MB by the API; leave room for multipart overhead
    client_max_body_size 11m;

    # -------------------------------------------------------------------
    # Security headers (OWASP recommended)
    # -------------------------------------------------------------------
    # NOTE: any add_header inside a location replaces ALL of these, so
    # locations that add their own headers must repeat this block.

    # Prevent clickjacking
    add_header X-Frame-Options DENY always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options nosniff always;

    # HSTS — enforce HTTPS for one year (including subdomains)
    # NOTE: Only applies when accessed via HTTPS; harmless on HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy — the Vite production build ships only external
    # module scripts, so script-src needs neither 'unsafe-inline' nor 'unsafe-eval'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy (restrict dangerous browser features)
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Avoid disclosing the Nginx version (the standard image has no headers-more module)
    server_tokens off;

    # -------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 256;

    # -------------------------------------------------------------------
    # SPA fallback — send all non-file routes to index.html
    # -------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------
    # Proxy API requests to the backend container (internal network)
    # -------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------
    # Prometheus metrics stay internal — never expose them through nginx
    # -------------------------------------------------------------------
    location /metrics {
        return 404;
    }

    # -------------------------------------------------------------------
    # Cache static assets aggressively (repeats the security headers above)
    # -------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }

    # -------------------------------------------------------------------
    # Health check endpoint (for load balancer)
    # -------------------------------------------------------------------
    location /health {
        access_log off;
        # default_type instead of add_header keeps the server-level headers
        default_type text/plain;
        return 200 "healthy\n";
    }
}
